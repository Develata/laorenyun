name: Distribution CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: distribution-${{ github.ref }}
  cancel-in-progress: true
jobs:
  distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
      - run: node scripts/verify-upstream.mjs
      # packaging-lock verification runs inside build-dsh.sh after frozen install.
      - run: node scripts/verify-release.mjs
      - run: node --test scripts/config.test.mjs scripts/release/*.test.mjs demo/scripts/*.test.mjs
      - run: node demo/scripts/scan.mjs
      - run: git diff --check
      - run: cp .env.example .env
      - name: Build pinned source image
        run: docker compose build > /tmp/build.log 2>&1 || { tail -80 /tmp/build.log; exit 1; }
      - name: Cloud-independent production readiness
        run: |
          cp .env.example .env
          docker compose -p laorenyun-ci up -d --wait --wait-timeout 90
          test "$(docker compose -p laorenyun-ci exec -T laorenyun id -u)" = 10001
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3080/)" = 401
          docker compose -p laorenyun-ci restart
          docker compose -p laorenyun-ci up -d --wait --wait-timeout 90
      - name: Preserve actual distributed bundle inputs (no image publication)
        run: |
          mkdir -p artifacts/distribution-inputs
          docker run --rm --network none --entrypoint cat laorenyun:0.2.0 /opt/laorenyun/licenses/bundle-inputs.json > artifacts/distribution-inputs/bundle-inputs.json
          docker run --rm --network none -i --entrypoint node laorenyun:0.2.0 --input-type=module < scripts/license-inventory.mjs > artifacts/distribution-inputs/inventory.json
          docker image inspect laorenyun:0.2.0 --format '{{.Id}}' > artifacts/distribution-inputs/image-id.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: distribution-inputs
          path: artifacts/distribution-inputs/
          retention-days: 7
          if-no-files-found: error
      - name: Stop test container (keep logs private)
        if: always()
        run: docker compose -p laorenyun-ci stop || true
