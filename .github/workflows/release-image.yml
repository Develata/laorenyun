name: Container release
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable tag to validate
        required: true
        type: string
      dry_run:
        description: Validate only; never start the publication job
        type: boolean
        default: true
      allow_backfill:
        description: Explicitly allow adding new verified assets to an existing Release
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: container-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      commit: ${{ steps.verify.outputs.commit }}
      version: ${{ steps.verify.outputs.version }}
      plugin: ${{ steps.verify.outputs.plugin }}
      dsh: ${{ steps.verify.outputs.dsh }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
          persist-credentials: false
      - name: Reject branch release or manual unreviewed workflow
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then test "$REF" = refs/heads/main; else test "$REF" = "refs/tags/$TAG"; fi
          node --input-type=module -e 'import {releaseVersion} from "./tooling/scripts/release/contracts.mjs"; releaseVersion(process.env.TAG)'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: node tooling/scripts/release/inputs.mjs "$TAG" source inputs.json
  checks:
    needs: inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - run: node --test scripts/release/*.test.mjs
  image:
    needs: inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.inputs.outputs.commit }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: source
          platforms: linux/amd64
          push: false
          load: true
          tags: laorenyun:release-candidate
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=https://github.com/Develata/laorenyun
            org.opencontainers.image.revision=${{ needs.inputs.outputs.commit }}
            org.opencontainers.image.version=${{ needs.inputs.outputs.version }}
            org.opencontainers.image.licenses=MIT AND GPL-2.0-or-later AND LGPL-3.0-or-later
            io.laorenyun.plugin-revision=${{ needs.inputs.outputs.plugin }}
            io.laorenyun.dsh-revision=${{ needs.inputs.outputs.dsh }}
      - name: Install pinned test-only browser
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" --ignore-scripts --no-audit --no-fund playwright@1.61.1
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Fresh volume, private access, native composer and restart
        env:
          RELEASE_BROWSER_RUNTIME: ${{ runner.temp }}/browser
        run: node tooling/scripts/release/acceptance.mjs laorenyun:release-candidate source delivery
      - name: Inventory actual image and assemble source material
        run: node tooling/scripts/release/sources.mjs laorenyun:release-candidate delivery source
      - name: Source-delivery gate (must pass before any packages-write job)
        id: gate
        run: |
          node tooling/scripts/release/verify-bundle.mjs delivery "$(docker image inspect laorenyun:release-candidate --format '{{.Id}}')"
          echo 'allowed=true' >> "$GITHUB_OUTPUT"
      - name: Save exact accepted image; publication never rebuilds
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.inputs.outputs.tag }}
        run: |
          node tooling/scripts/release/inputs.mjs "$TAG" source delivery/inputs.json
          docker image inspect laorenyun:release-candidate --format '{{.Id}}' > delivery/image-id.txt
          docker save laorenyun:release-candidate | gzip -1n > delivery/image.tar.gz
          cd delivery
          sha256sum image.tar.gz image-id.txt inputs.json acceptance.json inventory.json container-source-manifest.json container-sources.tar.gz > TRANSFER_SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tested-image
          path: |
            delivery/*.json
            delivery/*.txt
            delivery/*.gz
            delivery/TRANSFER_SHA256SUMS
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Preserve only sanitized audit receipts, never runtime logs/image on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: distribution-audit
          path: |
            delivery/acceptance.json
            delivery/inventory.json
            delivery/container-source-manifest.json
            delivery/source-gate.json
            delivery/container-sources.tar.gz
          retention-days: 7
          if-no-files-found: ignore
  publish:
    needs: [inputs, checks, image]
    if: needs.image.outputs.allowed == 'true' && (github.event_name == 'push' || inputs.dry_run == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.inputs.outputs.commit }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: tested-image
          path: delivery
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify, load same bytes, preserve immutable aliases, attach source and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ALLOW_BACKFILL: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_backfill == true }}
        run: node tooling/scripts/release/publish.mjs delivery source
      - name: Inspect first-publication visibility without changing account settings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api users/develata/packages/container/laorenyun --jq '{name,visibility}' > delivery/package-visibility.json
          mkdir -p "$RUNNER_TEMP/anonymous-docker"
          if docker --config "$RUNNER_TEMP/anonymous-docker" pull "$(cat delivery/image-digest.txt)"; then
            echo 'Anonymous pull verified' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Image published but anonymous pull NOT verified. Inspect package visibility; no account setting was changed.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
