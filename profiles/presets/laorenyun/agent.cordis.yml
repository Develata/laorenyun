# Agent services must be mounted in the preset realm, not the host bundle leaf.
- id: oral-history
  name: cordis:group
  group: true
  isolate:
    compaction: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
      config:
        thresholdRatio: 0.15
        retainTokens: 4000
        maxTokens: 64
        compactionRetries: 1
    - id: oral-history-interviewer
      name: dsh-laorenyun/interviewer
